<!DOCTYPE html>
<!-- WordDock converter v2.1 — WD26, SUBCAT (2026-09-13) -->
<!--
  A curator's tool, not part of the app. It is deliberately NOT linked from
  WordDock and knows nothing about scores, sync or study.

  Its one job: turn a curated WD26 workbook into the <DOMAIN>.json the app
  fetches on boot — on Michel's laptop, without a Python install and without a
  session with Claude. That is what makes "Excel is the source, JSON is the
  published edition" a rule that can actually be kept.

  WD26 (since 2026-09-12): 26 columns, L first, A1 sentinel = "L". The six core
  columns L, ID, ENTRY, CAT, SUBCAT, NOTE are published; anything beyond column 26
  (curators' working notes) never is. IDs are padded to 4 digits. The output is
  written in Python json.dumps style (space after colon and comma), so a
  regenerated file shows a git diff containing ONLY the words that changed.
  This is the only converter (the Python script was retired 2026-09-13).

  IDENTITY: the filename decides the domain — the same rule the app uses on
  import. The Metadata sheet stays inert: it is read only to cross-check, and
  a disagreement is reported rather than resolved. A stale Metadata cell in a
  copied file must never be able to mis-file a list silently.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>WordDock converter</title>
<style>
:root{
  --bg:#22252c;
  --ink:#ffffff;
  --muted:#8794a4;
  --dim:rgba(255,255,255,0.55);
  --green:#006600;
  --panel:#2b2f38;
  --panel-border:#3a404b;
  --line:#333944;
  --warn:#d9a441;
  --bad:#c9564e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:top;
  align-items:center;
  padding:40px 20px;
}
.wrap{width:100%;max-width:720px;margin:0 auto}

header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px}
h1{font-family:'Poppins',sans-serif;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:.01em;display:flex;align-items:center;gap:2px}
/* The app's W, inline and sized to the title. Remove the span to drop it. */
.w-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.5em;height:1.5em;border-radius:.4em;
  background:var(--green);color:#fff;
  font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1em;line-height:1;
}
.sub{color:var(--muted);font-size:13px;margin-top:8px}

/* The drop target is the whole interface until a file arrives. */
#drop{
  border:1px dashed var(--panel-border);
  border-radius:10px;
  padding:44px 24px;
  text-align:center;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
#drop:hover,#drop.over{border-color:var(--green);background:rgba(0,102,0,0.07)}
#drop:focus-visible{outline:2px solid var(--green);outline-offset:3px}
#drop .big{font-size:16px}
#drop .small{color:var(--muted);font-size:13px;margin-top:8px}

/* Readout: the honest part. Everything the conversion decided, in the open. */
#report{margin-top:26px;display:none}
.card{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:14px;
}
.row{display:flex;justify-content:space-between;gap:16px;padding:5px 0}
.row .k{color:var(--muted);font-size:13px}
.row .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.card h2{
  font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
.note{font-size:13px;line-height:1.6;color:var(--dim)}
.note.warn{color:var(--warn)}
.note.bad{color:var(--bad)}
.note+.note{margin-top:7px}
ul.skips{list-style:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:var(--warn)}
ul.skips li{padding:2px 0}

button.go{
  display:block;width:100%;
  background:var(--green);color:#fff;border:0;border-radius:8px;
  padding:14px;font-size:15px;font-family:inherit;cursor:pointer;
}
button.go:hover{filter:brightness(1.12)}
button.go:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.go[disabled]{background:var(--panel);color:var(--muted);cursor:not-allowed}
.again{
  display:block;margin:14px auto 0;background:none;border:0;
  color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
}
footer{margin-top:36px;color:var(--muted);font-size:12px;line-height:1.7}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header><h1>Converter</h1>
  <p> </p>
  <p> </p>
  <p> </p>
    <div class="sub">Excel is the source. This makes the publishable json.</div>
</header>
  <div>
    
</div>
<div id="drop" tabindex="0" role="button" aria-label="Choose or drop an xlsx file">
  <div class="big">Drop a WD26 Full <code>.xlsx</code> here</div>
  <div class="small">or click to choose one</div>
</div>
<input type="file" id="file" accept=".xlsx" hidden>

<div id="report"></div>

<footer>
  Named <code>DOMAIN_name.xlsx</code> — the first part before the underscore
  becomes the domain, and the output is <code>DOMAIN.json</code>.<br>
  Commit the Excel and the JSON together, in one commit.
</footer>

</div>

<script src="xlsx.full.min.js"></script>
<script>
"use strict";

const COLUMNS = [
  "L","ID","ENTRY","CAT","SUBCAT","NOTE",
  "Q1","A1","Q2","A2","Q3","A3","Q4","A4","Q5","A5",
  "Q6","A6","Q7","A7","Q8","A8","Q9","A9","Q10","A10"
];
const MIN_ROWS = 10;

/* Cell -> trimmed string, or null when empty. */
function clean(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  return s ? s : null;
}

/* Serialise one row the way Python's json.dumps(..., ensure_ascii=False)
   does: a space after every colon and comma, non-ASCII left alone, keys in
   canonical order. JSON.stringify alone would omit those spaces and the file
   would differ from the Python output on every single line — a diff that
   hides the one word that actually changed. */
function pyRow(row){
  const parts = [];
  for (const k of ["ID","ENTRY","CAT","SUBCAT","L","NOTE"]){
    parts.push(JSON.stringify(k) + ": " + JSON.stringify(row[k]));
  }
  const pairs = row.pairs
    .map(p => '{"q": ' + JSON.stringify(p.q) + ', "a": ' + JSON.stringify(p.a) + '}')
    .join(", ");
  parts.push('"pairs": [' + pairs + ']');
  return "{" + parts.join(", ") + "}";
}

/* Split "NL-RU_Full.xlsx" into { domain, name }. Underscore separates;
   everything after the first one is the name. No underscore means no domain,
   and the tool says so rather than guessing. */
function parseFilename(raw){
  const base = String(raw || "").replace(/\.xlsx$/i, "").trim();
  const cut = base.indexOf("_");
  if (cut < 1) return { domain: null, name: base };
  return { domain: base.slice(0, cut).trim().toUpperCase(), name: base.slice(cut + 1).trim() };
}

function convert(wb, filename){
  const out = { ok:false, error:null, rows:[], skipped:[], domain:null,
                name:null, metaDomain:null, sheet:null, railWarnings:[] };

  // The data sheet is the first one whose A1 is literally "L" (WD26).
  // Old SF25 files (A1 = "ID") are refused on purpose: deliberate break, 2026-09-12.
  let sheet = null;
  for (const nm of wb.SheetNames){
    const a1 = wb.Sheets[nm]["A1"];
    if (a1 && clean(a1.v) === "L"){ sheet = wb.Sheets[nm]; out.sheet = nm; break; }
  }
  if (!sheet){
    out.error = "No WD26 data sheet found. One sheet must have \u201CL\u201D in cell A1 " +
                "(older files with \u201CID\u201D in A1 are not accepted any more).";
    return out;
  }

  const aoa = XLSX.utils.sheet_to_json(sheet, { header:1, defval:null, raw:true });
  if (aoa.length < 2){ out.error = "The data sheet has a header but no rows."; return out; }

  const header = aoa[0].map(h => clean(h) || "").map(h => h.toUpperCase() === "CTAG" ? "SUBCAT" : h);
  for (let i = 0; i < COLUMNS.length; i++){
    if (header[i] !== COLUMNS[i]){
      out.error = "Column " + (i+1) + " should be \u201C" + COLUMNS[i] +
                  "\u201D but is \u201C" + (header[i] || "empty") +
                  "\u201D. The 26 columns must be in the WD26 order: L, ID, ENTRY, CAT, SUBCAT, NOTE, Q1, A1 \u2026 Q10, A10.";
      return out;
    }
  }

  const idx = {};
  COLUMNS.forEach((n,i) => idx[n] = i);

  for (let r = 1; r < aoa.length; r++){
    const arr = aoa[r];
    if (!arr || arr.every(c => clean(c) === null)) continue;   // blank row

    let id = clean(arr[idx.ID]);
    if (id && /^\d+$/.test(id)) id = id.padStart(4, "0");   // Excel turns 0001 into 1
    const q1 = clean(arr[idx.Q1]);
    const a1 = clean(arr[idx.A1]);

    // A row travels only if it can be studied: an identity and one Q/A pair.
    if (!(id && q1 && a1)){
      if (id) out.skipped.push("row " + (r+1) + " (" + id + "): Q1 or A1 missing");
      continue;
    }

    const pairs = [];
    for (let i = 1; i <= 10; i++){
      const q = clean(arr[idx["Q"+i]]);
      const a = clean(arr[idx["A"+i]]);
      if (q && a) pairs.push({ q:q, a:a });
    }

    out.rows.push({
      ID: id,
      ENTRY: clean(arr[idx.ENTRY]) || "",
      CAT:   clean(arr[idx.CAT])   || "",
      SUBCAT: clean(arr[idx.SUBCAT]) || "",
      L:     clean(arr[idx.L])     || "",
      NOTE:  clean(arr[idx.NOTE])  || "",
      pairs: pairs
    });
  }

  if (out.rows.length < MIN_ROWS){
    out.error = "Only " + out.rows.length + " valid row" + (out.rows.length === 1 ? "" : "s") +
                "; a list needs at least " + MIN_ROWS + ".";
    return out;
  }

  // 10c: the two rails must agree. The app introduces cards in ID order and L
  // labels that order; if L goes down while ID goes up, the curator numbered
  // against their own levels. Warn loudly; publishing stays the curator's call.
  let prevL = "", prevId = "";
  for (const row of [...out.rows].sort((a,b) => a.ID < b.ID ? -1 : a.ID > b.ID ? 1 : 0)){
    const L = (row.L || "").toUpperCase();
    if (L && prevL && L < prevL){
      out.railWarnings.push(row.ID + " is " + L + " but comes after " + prevId + " (" + prevL + ")");
    }
    if (L){ prevL = L; prevId = row.ID; }
  }

  // Identity from the filename — never from Metadata.
  const parsed = parseFilename(filename);
  out.domain = parsed.domain;
  out.name   = parsed.name;

  // Metadata is read for one purpose only: to disagree out loud.
  if (wb.SheetNames.indexOf("Metadata") !== -1){
    const meta = XLSX.utils.sheet_to_json(wb.Sheets["Metadata"], { header:1, defval:null, raw:true });
    for (const r of meta){
      if (r && clean(r[0]) === "Domain"){ out.metaDomain = clean(r[1]); break; }
    }
  }

  out.ok = true;
  return out;
}

function buildJson(rows){
  let s = "[\n";
  rows.forEach((row,i) => { s += "  " + pyRow(row) + (i < rows.length-1 ? "," : "") + "\n"; });
  return s + "]\n";
}

/* ── Screen ──────────────────────────────────────────────────────────────── */

const $drop = document.getElementById("drop");
const $file = document.getElementById("file");
const $report = document.getElementById("report");

function esc(s){
  return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
}

function show(html){ $report.innerHTML = html; $report.style.display = "block"; }

function fail(msg){
  show('<div class="card"><h2>Not converted</h2>' +
       '<p class="note bad">' + esc(msg) + '</p></div>' +
       '<button class="again" type="button" onclick="reset()">Try another file</button>');
}

function reset(){
  $report.style.display = "none";
  $report.innerHTML = "";
  $file.value = "";
  $drop.style.display = "";
}
window.reset = reset;

function handle(file){
  const reader = new FileReader();
  reader.onerror = () => fail("Could not read that file.");
  reader.onload = e => {
    let wb;
    try { wb = XLSX.read(new Uint8Array(e.target.result), { type:"array" }); }
    catch (err){ return fail("That is not a readable .xlsx file."); }

    const res = convert(wb, file.name);
    if (!res.ok) return fail(res.error);

    if (!res.domain){
      return fail("The filename has no underscore, so there is no domain to " +
                  "name the output after. Rename it to DOMAIN_name.xlsx " +
                  "\u2014 for example NL-RU_Full.xlsx \u2014 and drop it again.");
    }

    const json = buildJson(res.rows);
    const outName = res.domain + ".json";

    // The disagreement that matters: filename says one thing, the workbook's
    // own Metadata says another. Neither is trusted over the other here —
    // the person is told, and decides.
    let notes = "";
    if (res.metaDomain && res.metaDomain !== res.domain){
      notes += '<p class="note warn">The filename says the domain is <b>' +
        esc(res.domain) + '</b>, but the Metadata sheet inside says <b>' +
        esc(res.metaDomain) + '</b>. The filename wins, so this will be saved as ' +
        esc(outName) + '. If that is wrong, rename the file and drop it again.</p>';
    }
    if (res.railWarnings.length){
      notes += '<p class="note warn">L goes down while ID goes up in ' + res.railWarnings.length +
        ' place' + (res.railWarnings.length === 1 ? "" : "s") +
        '. The app introduces cards in ID order, so these levels will be met out of sequence. ' +
        'Check the numbering before publishing.</p>' +
        '<ul class="skips">' +
        res.railWarnings.slice(0,12).map(s => "<li>" + esc(s) + "</li>").join("") +
        (res.railWarnings.length > 12 ? "<li>\u2026 and " + (res.railWarnings.length-12) + " more</li>" : "") +
        '</ul>';
    }
    if (res.skipped.length){
      notes += '<p class="note warn">' + res.skipped.length +
        ' row' + (res.skipped.length === 1 ? "" : "s") +
        ' did not travel \u2014 no Q1 or no A1. They are missing from the JSON, ' +
        'and the app will never show them.</p>' +
        '<ul class="skips">' +
        res.skipped.slice(0,12).map(s => "<li>" + esc(s) + "</li>").join("") +
        (res.skipped.length > 12 ? "<li>\u2026 and " + (res.skipped.length-12) + " more</li>" : "") +
        '</ul>';
    }

    const pairCount = res.rows.reduce((n,r) => n + r.pairs.length, 0);

    show(
      '<div class="card">' +
        '<h2>Converted</h2>' +
        '<div class="row"><span class="k">Domain (from the filename)</span><span class="v">' + esc(res.domain) + '</span></div>' +
        '<div class="row"><span class="k">Rows</span><span class="v">' + res.rows.length + '</span></div>' +
        '<div class="row"><span class="k">Q/A pairs</span><span class="v">' + pairCount + '</span></div>' +
        '<div class="row"><span class="k">Data sheet</span><span class="v">' + esc(res.sheet) + '</span></div>' +
        '<div class="row"><span class="k">Saves as</span><span class="v">' + esc(outName) + '</span></div>' +
      '</div>' +
      (notes ? '<div class="card"><h2>Worth knowing</h2>' + notes + '</div>' : "") +
      '<button class="go" type="button" id="save">Save ' + esc(outName) + '</button>' +
      '<button class="again" type="button" onclick="reset()">Convert another file</button>'
    );

    document.getElementById("save").onclick = () => {
      const blob = new Blob([json], { type:"application/json;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = outName;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    };
  };
  reader.readAsArrayBuffer(file);
}

$drop.onclick = () => $file.click();
$drop.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $file.click(); } };
$file.onchange = () => { if ($file.files[0]) handle($file.files[0]); };

$drop.addEventListener("dragover", e => { e.preventDefault(); $drop.classList.add("over"); });
$drop.addEventListener("dragleave", () => $drop.classList.remove("over"));
$drop.addEventListener("drop", e => {
  e.preventDefault();
  $drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) handle(f);
});
// Don't let a stray drop elsewhere navigate away from the page.
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());
</script>
</body>
</html>
