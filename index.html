<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23006600'/%3E%3Ctext x='16' y='25' font-family='Georgia,serif' font-weight='700' font-size='26' fill='%23ffffff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
/* ── WordDock — v0.22.1 ─────────────────────────────────────────
   Words: v27/build.md ("the three words"); columns: v27/columns.md.
   · list  = one space: its rows, its IDs, its pool (wd_rs_<key>). Nothing is
             shared across lists. A WD list is published (lists/<NAME>.json, on
             the WD_LISTS line); a My list lives on this device, from a sheet.
             A list has one name, shown everywhere: NL-RU, NL-LA-LIEVE.
   · view  = what the table shows: a level range and a word, per list.
   · deck  = the ten lowest-RS words of the view; finish line: all ten clean.
   Surfaces: study (card + Again / Good, the name in the corner is the door
   into the list) · list (heading with ▾, search · Level · pager · Study, the
   table) · LISTS (three zones: Published WD Lists, My Lists on this device,
   the door in: + Add a list from an Excel sheet) · About ("About WordDock" on the
   bottom line of LISTS opens it: a rail of topics, the chosen topic's text; "All lists", Esc or back returns).
   Engine from v26.98 except the finish line. Writes RS only at deck completion. */
:root{
  --bg:#fff;--fg:#1a1a18;--muted:#8a8980;--sec:#56554f;--line:#e7e6df;--line2:#cfcdc4;
  --card:#f6f5ef;--accent:#185fa5;--green:#006600;--green2:#0a7a0a;--q:#6b6a64;
  --again:#b44a4a;--again-ink:#6e1010;--good:#3f8a4f;--good-ink:#0a5a0a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}

/* ── top line: the W; in study the list's title, small and regular ── */
.top{position:relative;height:52px}
.top-in{position:absolute;left:46px;top:14px;display:flex;align-items:center;max-width:calc(100% - 62px)}
.mark{position:absolute;left:16px;top:14px;user-select:none}
.mark.badge{width:24px;height:24px;border-radius:7px;background:var(--green);color:#fff;display:flex;align-items:center;
  justify-content:center;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:15px}
/* The W is the door to About (and back out of it). */
.crumbs{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
/* The door from study into the list: the list's title, nothing more. */
.crumb{background:none;border:none;padding:3px 8px;border-radius:6px;color:var(--fg);cursor:pointer;font-size:13px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--card)}

/* ── list surface ── */
.wrap{max-width:920px;margin:0 auto;padding:.25rem 1.25rem 1.5rem}
.h{font-size:22px;font-weight:600;margin:.5rem 0 0;line-height:1.3}
.h button{background:none;border:none;padding:2px 8px;margin-left:-8px;border-radius:8px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.h button:hover{background:var(--card)}
.sub{color:var(--sec);font-size:13px;margin:2px 0 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:.9rem 0 .75rem}
.controls[hidden]{display:none}
input[type=search]{flex:1;min-width:170px;height:36px;padding:0 12px;border:.5px solid var(--line2);border-radius:8px;
  background:var(--bg);color:var(--fg);font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=search].on{border-color:var(--fg)}
/* Level field: the grey value is the whole range, and it teaches the syntax. */
.lvl-f{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 10px;border:.5px solid var(--line2);border-radius:8px;
  font-size:13px;color:var(--muted);background:var(--bg);cursor:text}
.lvl-f[hidden]{display:none}
.lvl-f input,.lvl-f input[type=search]{flex:none;width:84px;min-width:0;border:none;outline:none;box-shadow:none;background:transparent;color:var(--fg);
  font-size:14px;height:32px;padding:0;border-radius:0;font-variant-numeric:tabular-nums}
.lvl-f input[type=search]:focus{border:none;box-shadow:none}
.lvl-f input::placeholder{color:var(--muted);opacity:.75}
.lvl-f:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.lvl-f.on{border-color:var(--fg)}
.lvl-f.bad{border-color:var(--again)}
.count{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:2px}
.pager button{background:none;border:none;color:var(--sec);font-size:17px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:7px}
.pager button:hover:not([disabled]){background:var(--card);color:var(--fg)}
.pager button[disabled]{color:var(--line2);cursor:default}
.pager button[hidden]{display:none}
.study-btn{height:36px;padding:0 16px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:14px;
  font-weight:600;cursor:pointer;white-space:nowrap;margin-left:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.study-btn:hover{background:var(--green2)}
.study-btn[disabled]{opacity:.4;cursor:default}
.study-btn[hidden]{display:none}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
td,th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr{height:38px}
thead th{text-align:left;font-weight:500;color:var(--sec);font-size:12px;letter-spacing:.02em;padding:8px 10px;border-bottom:.5px solid var(--line2);
  cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--fg)}
thead th.plain{cursor:default}
thead th .arr{color:var(--muted);font-size:11px;margin-left:3px}
td{padding:8px 10px;border-bottom:.5px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--card)}
tbody tr.link{cursor:pointer}
.id{font-family:var(--mono);font-size:12px;color:var(--sec);white-space:nowrap}
.b{font-weight:500}.ru{font-size:15px}
.c{text-align:center;color:var(--sec)} th.c{text-align:center}
.lvl{font-family:var(--mono);font-size:12px;color:var(--sec)}
.tag{font-size:12px;background:var(--card);padding:2px 8px;border-radius:8px;color:var(--sec);white-space:nowrap}
.rs{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.dim{color:var(--muted)}
.now{font-size:12px;color:var(--green2);white-space:nowrap;text-align:right}
.empty{padding:2rem;text-align:center;color:var(--muted);font-size:14px}
.empty[hidden]{display:none}
/* Values you can tap: they land in the search box. */
.tap{cursor:pointer;border-radius:6px}
span.tap:not(.tag):hover{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.tag.tap:hover{background:var(--line);color:var(--fg)}
tbody tr.row.open .tag,tbody tr.row:hover .tag{background:var(--bg)}
.cs-sub,.tg{color:var(--sec);font-size:13px}
tbody tr.row{cursor:pointer}
tbody tr.row.open{background:var(--card)}
tbody tr.detail{height:auto;background:var(--card)}
tbody tr.detail:hover{background:var(--card)}
tr.detail td{white-space:normal;padding:2px 10px 14px;border-bottom:.5px solid var(--line2)}
.det-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 6px}
.det-meta b{color:var(--sec);font-weight:500;margin-right:14px;display:inline-block}
.det-pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:20px;row-gap:3px;font-size:14px}
.det-pairs .dq{color:var(--q)}.det-pairs .da{font-weight:500}
.det-none{color:var(--muted);font-size:13px}
.det-grid{display:grid;grid-template-columns:max-content minmax(0,1fr) minmax(0,1fr) auto auto;column-gap:10px;row-gap:3px;margin:2px 0 10px;align-items:start}
.dg-h{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.dg-v{display:flex;flex-wrap:wrap;gap:4px;min-width:0;font-size:13px;color:var(--sec)}
.dg-v .tag{background:var(--bg);white-space:normal}
.dg-n{font-family:var(--mono);font-size:12px}

/* ── LISTS: three zones — WD lists on top, My lists in the middle, the door in at the bottom ── */
.cat{display:none;max-width:920px;margin:0 auto;padding:0 1.25rem;min-height:calc(100vh - 52px);min-height:calc(100dvh - 52px);
  grid-template-rows:auto 1fr auto}
body.cataloging .cat{display:grid}
body.cataloging .wrap{display:none}
.zone-mid{align-self:start;padding:2.75rem 0 1.25rem}   /* a fixed step under the WD lists, not centred in what is left */
.zone-mid .add{display:block;margin:0 0 .6rem}
.zone-bot{padding:.75rem 0 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* Sync: one small grey line at the bottom of LISTS; tap opens the dialog. */
.sync-line{background:none;border:none;padding:6px 0;color:var(--muted);font-size:12px;cursor:pointer}
.sync-line:hover{color:var(--sec);text-decoration:underline;text-underline-offset:3px}
.sync-dlg{position:relative}
.sync-x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:3px 7px;border-radius:7px}
.sync-x:hover{background:var(--card);color:var(--fg)}
.dlg .sync-desc{margin:0 0 10px;color:var(--sec);font-size:14px}
.dlg .sync-desc b{color:var(--fg);font-weight:600}
.sync-key{font-family:var(--mono);font-size:19px;letter-spacing:.06em;text-align:center;padding:12px;margin:10px 0;
  border:.5px solid var(--line2);border-radius:10px;background:var(--card);user-select:all}
.dlg .sync-err{color:var(--again);font-size:13px;min-height:1.2em;margin:0 0 6px}
.dlg .sync-input{width:100%;height:38px;padding:0 10px;border:.5px solid var(--line2);border-radius:8px;font-size:15px;font-family:var(--mono);margin:0 0 8px}
.dlg .sync-input:focus{outline:none;border-color:var(--accent)}
.sync-actions{flex-wrap:wrap;margin-top:14px}
.sec-h{font-size:20px;font-weight:600;margin:.5rem 0 0;line-height:1.3}
.cat .controls{margin:.7rem 0 .25rem}
.cat tbody tr{cursor:pointer}
td.act{text-align:right;white-space:nowrap}
.ib{background:none;border:none;color:var(--sec);font-size:16px;line-height:1;cursor:pointer;padding:3px 7px;border-radius:7px}
.ib:hover{background:var(--line);color:var(--fg)}
.ib.x{font-size:15px;color:var(--muted)}
.add{background:none;border:none;padding:6px 0;color:var(--green2);font-weight:500;font-size:14px;cursor:pointer}
.add:hover{text-decoration:underline;text-underline-offset:3px}
.dlg input{width:100%;height:36px;padding:0 10px;border:.5px solid var(--line2);border-radius:8px;font-size:14px;margin:-8px 0 16px}
.dlg input:focus{outline:none;border-color:var(--accent)}

/* ── About: the black page's surface (v26.98 #aboutbrowser), in the light page's colours.
   A rail of topics on the left, the chosen topic's text on the right; on a phone one
   pane at a time (the rail first, a topic opens its text, the heading goes back). ── */
.about{display:none;max-width:920px;margin:0 auto;padding:.25rem 1.25rem 2rem}
body.abouting .about{display:block}
body.abouting .wrap,body.abouting .cat{display:none}
.about-h{font-size:22px;font-weight:600;margin:.5rem 0 0;line-height:1.3}
.about-h button{background:none;border:none;padding:2px 8px;margin-left:-8px;border-radius:8px;font:inherit;color:inherit;cursor:default;text-align:left}
.about-panes{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:32px;margin-top:1rem}
.about-rail{border-right:.5px solid var(--line2);padding-right:14px;align-self:start}
.about-topic{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;margin:0 0 3px;border-radius:8px;
  font-size:14px;color:var(--sec);cursor:pointer;line-height:1.35}
.about-topic:hover{background:var(--card);color:var(--fg)}
.about-topic.active{background:var(--green);color:#fff}
.about-content{max-width:640px;min-width:0}
.about-content h2{font-size:20px;font-weight:600;margin:.15rem 0 .7rem;line-height:1.3}
.about-content p{color:var(--sec);font-size:15px;line-height:1.65;margin:0 0 .85rem}
.about-content em{color:var(--fg);font-style:italic}
.about-content code{font-family:var(--mono);font-size:12.5px;background:var(--card);border:.5px solid var(--line);padding:1px 5px;border-radius:4px;color:var(--fg);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.about-content a{color:var(--accent);text-underline-offset:2px}
.about-content .soon{color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;cursor:default}

/* ── study: the list is gone; card + Again / Good ── */
.study{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;
  align-items:center;padding:0 16px}
.study-block{position:absolute;left:16px;right:16px;top:42%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center}
body.studying .study{display:flex}
body.studying .wrap{display:none}
body.studying .top{position:relative;z-index:30}
.card{width:100%;max-width:680px;height:220px;background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 10px 36px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;
  padding:28px 40px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;
  transition:background-color .2s,border-color .2s;user-select:none}
/* The pairs of one word, as dots just above the counter: done · current · still to come.
   Only for a word with more than one pair; the row keeps its height, so the counter never jumps. */
.card-dots{display:flex;justify-content:center;gap:6px;height:6px}
.card-dots i{width:6px;height:6px;border-radius:50%;border:1px solid var(--line2);box-sizing:border-box}
.card-dots i.done{background:var(--line2)}
.card-dots i.now{background:var(--muted);border-color:var(--muted)}
.card-tag{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.card-text{font-size:28px;text-align:center;white-space:pre-line;word-break:break-word;max-height:100%;overflow-y:auto}
.card-text.q{color:var(--q)}.card-text.a{color:var(--fg)}
.card.done{background:#f1f8f1;border-color:#b9dcbc}
.card.done .card-text{color:var(--good-ink)}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{width:120px;height:42px;border-radius:10px;background:#fff;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:focus{outline:none}
.btn-again{border:1px solid color-mix(in srgb,var(--again) 55%,#fff);color:var(--again-ink)}
.btn-good{border:1px solid color-mix(in srgb,var(--good) 55%,#fff);color:var(--good-ink)}
.btn-again:hover{background:#fbf2f2}.btn-good:hover{background:#f1f8f1}

/* ── bottom line: the counter, only in study ── */
.pos{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;
  padding:10px 0 16px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--bg);pointer-events:none}
.pos:empty{display:none}
.pos > *{pointer-events:auto}

/* ── dialog ── */
.dlg-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg-back[hidden]{display:none}
.dlg{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:400px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.16)}
.dlg h3{margin:0 0 8px;font-size:16px}
.dlg p{margin:0 0 18px;color:var(--sec);font-size:14px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}
.dlg-actions button{height:36px;padding:0 14px;border-radius:8px;font-size:14px;cursor:pointer}
.dlg-cancel{background:#fff;border:.5px solid var(--line2);color:var(--sec)}
.dlg-ok{background:var(--green);border:none;color:#fff;font-weight:500}

/* A low screen (a phone on its side, often with the browser bar on top): the card and its
   buttons are centred in the room between the top line (52px) and the counter (~40px), and
   the card shrinks with that room, never below 80px and never above 150px. */
@media (max-height:500px){
  .study-block{top:calc(52px + (100dvh - 104px) / 2)}
  .card{height:clamp(80px, calc(100dvh - 176px), 150px);padding:10px 24px}
  .card-tag{top:6px;font-size:10px}
  .card-text{font-size:22px}
  .actions{margin-top:8px}
  .btn{height:38px}
  .pos{padding:6px 0 8px;gap:4px}
}
@media (max-width:640px){
  .top{padding:12px 12px 0}
  .mark{left:12px}
  .top-in{left:40px;max-width:calc(100% - 52px)}
  .wrap,.cat{padding-left:12px;padding-right:12px}
  .h{font-size:20px}.sec-h{font-size:18px}
  .hide-s{display:none}
  input[type=search]{min-width:0;flex:1 1 150px}
  .study-btn{margin-left:0;flex:1 1 100%}   /* phone: Study always gets its own full line */
  .card{height:200px;padding:24px 22px}
  .card-text{font-size:24px}
  .about{padding-left:12px;padding-right:12px}
  .about-h{font-size:20px}
  .about-panes{grid-template-columns:1fr;margin-top:.75rem}
  .about-rail{border-right:none;padding-right:0}
  .about.show-detail .about-rail,.about.show-rail .about-content{display:none}
  .about.show-detail .about-h button{cursor:pointer;color:var(--sec)}
  .about.show-detail .about-h button::before{content:"\2190\00a0"}
  .about.show-detail .about-h button:hover{background:var(--card);color:var(--fg)}
  .about-topic{min-height:46px;font-size:15px}
}
</style>
</head>
<body>

<header class="top">
  <div class="mark badge" aria-hidden="true">W</div>
  <div class="top-in"><nav class="crumbs" id="crumbs"></nav></div>
</header>

<main class="wrap" id="listSurface">
  <h1 class="h" id="h"></h1>
  <p class="sub" id="sub"></p>
  <div class="controls" id="controls">
    <input type="search" id="q" data-t-ph="search" data-t-aria="search" autocomplete="off" spellcheck="false">
    <label class="lvl-f" id="lvlBox"><span data-t="level"></span><input type="search" id="lvl" data-t-aria="levelAria" autocomplete="off" spellcheck="false" enterkeyhint="done"></label>
    <span class="pager"><button id="pgPrev" data-t-aria="prevPage">&#8249;</button><span class="count" id="count"></span><button id="pgNext" data-t-aria="nextPage">&#8250;</button></span>
    <button class="study-btn" id="btnStudy" data-t="study"></button>
  </div>
  <table id="table"><colgroup id="cols"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  <div class="empty" id="empty" hidden data-t="noMatches"></div>
</main>

<main class="cat" id="catalog">
  <section class="zone-top" id="secWd">
    <h2 class="sec-h" data-t="wdHeading"></h2>
    <p class="sub" id="wdSub"></p>
    <div class="controls" id="wdCtl">
      <input type="search" id="wdQ" data-t-ph="search" data-t-aria="searchWdAria" autocomplete="off" spellcheck="false">
      <span class="pager"><button id="wdPrev" data-t-aria="prevPage">&#8249;</button><span class="count" id="wdCount"></span><button id="wdNext" data-t-aria="nextPage">&#8250;</button></span>
    </div>

function loadXLSX(){
  if (window.XLSX) return Promise.resolve();
  if (!xlsxReady) xlsxReady = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "xlsx.full.min.js"; sc.onload = res; sc.onerror = () => { xlsxReady = null; rej(new Error(T.noReader)); }; document.head.appendChild(sc); });
  return xlsxReady;
}
const ALIAS = { L:"LVL", LVL:"LVL", LEVEL:"LVL", SEG:"LVL", ENT:"ENT", ENTRY:"ENT", CAT:"CAT", CATEGORY:"CAT", SUB:"SUB", TAG:"TAG", TAGS:"TAG" };
function canonHeader(h){
  const u = String(h ?? "").trim().toUpperCase().replace(/\s+/g, "");
  if (ALIAS[u]) return ALIAS[u];
  const m = u.match(/^([QA])(10|[1-9])$/); return m ? m[1] + m[2] : null;
}
const cellText = v => (v === null || v === undefined) ? "" : String(v).trim();
/* Headers by name, any order; the first sheet with Q1 and A1. A row needs Q1 and A1;
   the rest is optional; an empty ENT takes A1; IDs come from the row's place. */
function readSheet(buf){
  const wb = XLSX.read(buf, { type: "array" });
  for (const sname of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sname], { header: 1, defval: null, raw: true });
    for (let h = 0; h < Math.min(aoa.length, 10); h++){
      const map = {}; (aoa[h] || []).forEach((c, i) => { const k = canonHeader(c); if (k && !(k in map)) map[k] = i; });
      if (!("Q1" in map) || !("A1" in map)) continue;
      const rows = []; let skipped = 0;
      const get = (arr, k) => (k in map) ? cellText(arr[map[k]]) : "";
      for (let r = h + 1; r < aoa.length; r++){
        const arr = aoa[r] || []; if (arr.every(v => v === null || v === undefined || String(v).trim() === "")) continue;
        const pairs = []; for (let i = 1; i <= 10; i++){ const q = get(arr, "Q" + i), a = get(arr, "A" + i); if (q && a) pairs.push({ q, a }); }
        if (!get(arr, "Q1") || !get(arr, "A1")){ skipped++; continue; }
        const row = { ID: String(rows.length + 1).padStart(4, "0"), pairs };
        const L = ("LVL" in map) ? parseL(arr[map.LVL]) : null; if (L) row.L = L.text;
        row.ENT = get(arr, "ENT") || pairs[0].a;
        const cat = get(arr, "CAT"), sub = get(arr, "SUB"), tag = get(arr, "TAG");
        if (cat) row.CAT = cat; if (sub) row.SUB = sub; if (tag) row.TAG = tag;
        rows.push(row);
      }
      return { rows, skipped, sheet: sname };
    }
  }
  return null;
}
/* The sheet out: the curator's layout, every cell as Text, so it comes back in unchanged. File name = the key. */
function sheetOut(l){
  const H = ["ENT", "CAT", "SUB", "TAG", "L"]; for (let i = 1; i <= 10; i++) H.push("Q" + i, "A" + i);
  const aoa = [H];
  for (const r of l.rows){
    const arr = [r.ENT || null, r.CAT || null, r.SUB || null, r.TAG || null, r.LVL ?? null];
    for (let i = 0; i < 10; i++){ const p = r.pairs[i]; arr.push(p ? p.q : null, p ? p.a : null); }
    aoa.push(arr);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (const addr of Object.keys(ws)) if (addr[0] !== "!"){ ws[addr].t = "s"; ws[addr].v = String(ws[addr].v); ws[addr].z = "@"; }
  ws["!cols"] = H.map((h, i) => ({ wch: i < 5 ? 12 : 22 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, l.key.slice(0, 31));
  XLSX.writeFile(wb, l.key + ".xlsx");
}
async function exportList(key){
  const l = getList(key); if (!l.rows) return;
  try { await loadXLSX(); sheetOut(l); } catch (e) { await confirmDlg(T.noWriter, e.message, T.ok, T.close); }
}
async function importSheet(file){
  let got;
  try { await loadXLSX(); got = readSheet(await file.arrayBuffer()); }
  catch (e) { await confirmDlg(T.cantRead, e.message, T.ok, T.close); return; }
  if (!got){ await confirmDlg(T.noHeader, T.noHeaderBody, T.ok, T.close); return; }
  if (!got.rows.length){ await confirmDlg(T.nothing, T.nothingBody, T.ok, T.close); return; }
  // The name is the file name in capitals; a name that comes out empty is asked for.
  let key = keyFrom((file.name || "").replace(/\.[^.]+$/, ""));
  for (;;){
    if (!key){
      const v = await promptDlg(T.giveName, T.giveNameBody, "");
      if (v === null) return; key = keyFrom(v); continue;
    }
    if (isPublished(key)){
      const v = await promptDlg(T.isWd(key), T.nameYours(key + "-01"), key + "-01");
      if (v === null) return; key = keyFrom(v); continue;
    }
    break;
  }
  const words = nWords(got.rows.length), skip = got.skipped ? T.skipped(got.skipped) : "";
  const ex = LISTS[key] && LISTS[key].own && LISTS[key].rows ? LISTS[key] : null;
  let keepPool = true;
  if (ex){
    const old = nWords(ex.rows.length);
    if (sameOrder(ex.rows, normalizeRows(got.rows))){
      if (!(await confirmDlg(T.replaceQ(key, old, words), T.progressStays + skip, T.replace, T.keep))) return;
    } else {
      keepPool = false;
      if (!(await confirmDlg(T.otherOrder, T.replaceFresh(key) + skip, T.replace, T.keep))) return;
    }
  } else if (!(await confirmDlg(T.addQ(key), words + skip + ".", T.addBtn, T.cancel))) return;
  if (!putOwn(key, got.rows, keepPool)){ await confirmDlg(T.cantKeep, T.noRoom, T.ok, T.close); return; }
  if (activeKey === key) initDeck(LISTS[key].rows);
  goList(key);
}
async function removeList(key){
  const l = LISTS[key]; if (!l || !l.own) return;
  if (!(await confirmDlg(T.removeQ(key), T.progressGoes, T.remove, T.keep))) return;
  removeOwn(key);
  if (viewKey === key){ viewKey = WD_KEYS[0]; loadView(viewKey); }
  render();
}

let viewKey = WD_KEYS[0], activeKey = null;
let qText = "", query = "", lvlText = "", page = 0, sortKey = null, sortDir = 1, openId = null;
const CAT = { wd: { q: "", page: 0 }, my: { q: "", page: 0 } };   // LISTS: search and page per section

/* ── What the table shows is remembered per list: a level range and a word. ── */
function loadView(k){
  let v = {}; try { v = JSON.parse(localStorage.getItem(VIEW_KEY(k))) || {}; } catch {}
  qText = String(v.q || ""); query = strip(qText); lvlText = String(v.lvl || "");

/* ── Level field: "A1", "A1.3", "A1-A2", "A1.2-A1.5", "-B1", "B1-" (or numbers: "2", "2-4");
   a band alone covers all its units; empty = the whole list ── */
function parseLevel(t){
  const s = String(t || "").replace(/[–—]/g, "-").replace(/\s+/g, "");
  if (!s) return null;
  const end = (x, hi) => { const L = parseL(x); if (!L) return null; return L.unit === null ? L.rank * 1000 + (hi ? 999 : 0) : L.key; };
  const m = s.match(/^([^-]*)-([^-]*)$/);
  if (!m){ const lo = end(s, false), hi = end(s, true); return lo === null ? "bad" : { lo, hi }; }
  if (!m[1] && !m[2]) return "bad";
  let lo = m[1] ? end(m[1], false) : -Infinity, hi = m[2] ? end(m[2], true) : Infinity;
  if (lo === null || hi === null) return "bad";
  if (lo > hi){ lo = m[2] ? end(m[2], false) : -Infinity; hi = m[1] ? end(m[1], true) : Infinity; }
  return { lo, hi };
}
/* The first and last level among these rows, as text. */
function levelSpan(rows){
  let lo = null, hi = null;
  for (const r of rows) if (r.Lk != null){ if (!lo || r.Lk < lo.Lk) lo = r; if (!hi || r.Lk > hi.Lk) hi = r; }
  return lo ? { lo: lo.LVL, hi: hi.LVL } : null;
}

/* ── Columns: NL | LA | CAT | SUB | TAG | L | RS (phone: the first two) ── */
const COLS = [
  { k:"Q1",  label:T.colQ,   w:"25%", ws:"50%" },
  { k:"A1",  label:T.colA,   cls:"b ru", w:"25%", ws:"50%" },
  { k:"CAT", label:T.colCAT, cls:"hide-s", th:"hide-s", w:"14%" },
  { k:"SUB", label:T.colSUB, cls:"hide-s", th:"hide-s", w:"12%" },
  { k:"TAG", label:T.colTAG, cls:"hide-s", th:"hide-s", w:"11%" },
  { k:"LVL", label:T.colL,   cls:"lvl hide-s", th:"hide-s", w:"7%" },
  { k:"RS",  label:T.colRS,  cls:"rs hide-s", th:"c hide-s", w:"6%" }
];
const isSmall = () => window.matchMedia("(max-width:640px)").matches;
function setCols(ws){
  const cg = $("cols"); cg.innerHTML = "";
  for (const w of ws){ const c = document.createElement("col"); if (w) c.style.width = w; cg.appendChild(c); }
}
function sortVal(r, k, pool){
  if (k === "LVL") return r.Lk ?? Infinity;
  if (k === "RS") return pool[r.ID] || 0;
  if (k === "Q1") return r.pairs[0].q;
  if (k === "A1") return r.pairs[0].a;
  return r[k] || "";
}

/* ── Which rows the table shows: Level field ∩ search box.
   A word that is exactly a class, sub or tag name matches that value whole
   ("m" = masculine, not every word with an m). Anything else is plain text. ── */
const vocabCache = new WeakMap();
function vocabOf(rows){
  let v = vocabCache.get(rows);
  if (!v){ v = new Set(); for (const r of rows){ if (r.CAT) v.add(strip(r.CAT)); toks(r.SUB).forEach(t => v.add(strip(t))); toks(r.TAG).forEach(t => v.add(strip(t))); } vocabCache.set(rows, v); }
  return v;
}
function matcherFor(rows){
  const range = levelSpan(rows) ? parseLevel(lvlText) : null;   // a list without levels ignores a stale Level field
  const lvlOk = (range && range !== "bad") ? (r => r.Lk != null && r.Lk >= range.lo && r.Lk <= range.hi) : () => true;
  let textOk = () => true;
  if (query){
    textOk = vocabOf(rows).has(query)
      ? (r => strip(r.CAT) === query || toks(r.SUB).some(t => strip(t) === query) || toks(r.TAG).some(t => strip(t) === query))
      : (r => hayOf(r).includes(query));
  }
  return r => lvlOk(r) && textOk(r);
}
const visibleRows = () => { const rows = viewRows(); if (!rows) return []; const ok = matcherFor(rows); return rows.filter(ok); };

/* ── Top line: in study, the list's title = the door into the list; otherwise nothing ── */
/* The top line is the way one level up: on the card the list's name (→ the list),
   in the list "All lists" (→ LISTS). LISTS is the top: nothing. */
function renderCrumbs(){
  const c = $("crumbs"); c.innerHTML = "";
  const b = document.createElement("button"); b.className = "crumb";
  if (level === "study" && activeKey){ b.textContent = activeKey; b.title = T.toList; b.addEventListener("click", () => goList(activeKey)); }
  else if (level === "list"){ b.textContent = T.allLists; b.addEventListener("click", () => goCatalog()); }
  else if (level === "about"){ b.textContent = T.allLists; b.addEventListener("click", () => closeAbout()); }
  else return;
  c.appendChild(b);
}

/* ── The list surface ── */
const listKeys = () => [...new Set([...WD_KEYS, ...Object.keys(LISTS).filter(k => LISTS[k].own)])];
function renderHeading(){
  const h = $("h"); h.innerHTML = "";
  h.textContent = viewKey;          // just the name: the way up is "All lists" on the top line
}
function paged(rows){
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  if (page >= pages) page = pages - 1;
  return { slice: rows.slice(page * PAGE, page * PAGE + PAGE), pages, total: rows.length };
}
function tapSpan(text, value, cls){
  const s = document.createElement("span"); s.className = "tap" + (cls ? " " + cls : ""); s.textContent = text;
  s.title = T.showAll(value);
  s.addEventListener("click", e => { e.stopPropagation(); setQuery(value); });
  return s;
}
function fillCell(td, r, k, pool){
  if (k === "LVL"){ td.textContent = r.LVL ?? "·"; return; }
  if (k === "Q1"){ td.textContent = r.pairs[0].q; td.title = r.pairs[0].q; return; }
  if (k === "A1"){ td.textContent = r.pairs[0].a; td.title = r.pairs[0].a; return; }
  if (k === "RS"){ const v = pool[r.ID]; td.textContent = v === undefined ? "·" : v; return; }
  if (k === "CAT"){ if (!r.CAT){ td.textContent = "·"; return; } td.appendChild(tapSpan(r.CAT, r.CAT, "tag")); td.title = r.CAT; return; }
  const ts = toks(r[k]);
  if (!ts.length){ td.textContent = "·"; return; }
  ts.forEach((t, i) => { if (i) td.appendChild(document.createTextNode("\u2009")); td.appendChild(tapSpan(t, t, "tag")); });
  td.title = ts.join(", ");
}
/* Row unfold. PC: ID, ENT (the curator's references), then the other pairs.
   Phone: a small table of what the columns hide — CAT | SUB | TAG | L | RS, heads above
   values, CAT/SUB/TAG tappable as on a PC — then the other pairs. No ID, no ENT. */
function detailRow(r, pool, span){
  const tr = document.createElement("tr"); tr.className = "detail";
  const td = document.createElement("td"); td.colSpan = span;
  if (isSmall()){
    const g = document.createElement("div"); g.className = "det-grid";
    const cell = (cls, kids) => { const d = document.createElement("div"); d.className = cls; kids.forEach(k => d.appendChild(typeof k === "string" ? document.createTextNode(k) : k)); return d; };
    const tapsOr = vals => vals.length ? vals.map(v => tapSpan(v, v, "tag")) : ["·"];
    const cols = [
      [T.colCAT, tapsOr(r.CAT ? [r.CAT] : [])],
      [T.colSUB, tapsOr(toks(r.SUB))],
      [T.colTAG, tapsOr(toks(r.TAG))],
      [T.colL,   [r.LVL != null ? String(r.LVL) : "·"]],
      [T.colRS,  [pool[r.ID] === undefined ? "·" : String(pool[r.ID])]]
    ];
    cols.forEach(([h]) => g.appendChild(cell("dg-h", [h])));
    cols.forEach(([, v], i) => g.appendChild(cell("dg-v" + (i >= 3 ? " dg-n" : ""), v)));
    td.appendChild(g);
  } else {
    const meta = document.createElement("div"); meta.className = "det-meta";
    [[T.colID, r.ID], [T.colENT, r.ENT || "·"]].forEach(([k, v]) => { const b = document.createElement("b"); b.textContent = k + " " + v; meta.appendChild(b); });
    td.appendChild(meta);
  }
  const rest = r.pairs.slice(1);
  if (rest.length){
    const g = document.createElement("div"); g.className = "det-pairs";
    rest.forEach(p => { const q = document.createElement("div"); q.className = "dq"; q.textContent = p.q;
      const a = document.createElement("div"); a.className = "da ru"; a.textContent = p.a; g.append(q, a); });
    td.appendChild(g);
  } else { const n = document.createElement("div"); n.className = "det-none"; n.textContent = T.noOtherPairs; td.appendChild(n); }
  tr.appendChild(td);
  return tr;
}
const render = () => level === "about" ? null : level === "catalog" ? renderCatalog() : renderList();
function renderList(){
  const tbody = $("tbody"); $("thead").innerHTML = ""; tbody.innerHTML = ""; $("empty").hidden = true;
  renderHeading();
  let pages = 1, total = 0;
  const l = getList(viewKey), rowsAll = viewRows();
  $("btnStudy").hidden = false;
  if (!rowsAll){
    $("lvlBox").hidden = true;
    $("sub").textContent = "";
    $("empty").textContent = l.loaded ? T.nothingYet : T.loading; $("empty").hidden = false;
    setCols([]);
  } else {
    const span = levelSpan(rowsAll), range = parseLevel(lvlText);
    // The grey value of the field is the whole range: what exists, and how to type it.
    $("lvlBox").hidden = !span;
    $("lvl").placeholder = span ? span.lo + "-" + span.hi : "";
    $("lvlBox").classList.toggle("bad", range === "bad");
    $("lvlBox").classList.toggle("on", !!range && range !== "bad");
    $("q").classList.toggle("on", !!query);
    const small = isSmall();
    setCols(COLS.filter(c => !small || c.ws).map(c => small ? c.ws : c.w));
    const pool = readPool(viewKey);
    const trh = document.createElement("tr");
    for (const c of COLS){
      const th = document.createElement("th"); if (c.th) th.className = c.th;
      th.textContent = c.k === "Q1" ? l.q : c.k === "A1" ? l.a : c.label;
      if (sortKey === c.k){ const s = document.createElement("span"); s.className = "arr"; s.textContent = sortDir > 0 ? "▲" : "▼"; th.appendChild(s); }
      th.addEventListener("click", () => { sortDir = sortKey === c.k ? -sortDir : 1; sortKey = c.k; page = 0; renderList(); });
      trh.appendChild(th);
    }
    $("thead").appendChild(trh);
    let rows = visibleRows();
    // The line under the heading: which levels, how many words.
    let lv = "";
    if (span){
      const sp = range && range !== "bad" ? levelSpan(rows) : span;
      lv = !sp ? T.levelOne(lvlText.trim()) : sp.lo === sp.hi ? T.levelOne(sp.lo) : T.levelSpan(sp.lo, sp.hi);
    }
    const since = l.own ? ownSince(viewKey) : "";
    $("sub").textContent = [lv, nWords(rows.length), l.own ? (since ? T.onDeviceSince(since) : T.onDevice) : ""].filter(Boolean).join(" · ");
    if (sortKey) rows = [...rows].sort((x, y) => {
      const a = sortVal(x, sortKey, pool), b = sortVal(y, sortKey, pool);
      const c = (typeof a === "number" && typeof b === "number") ? a - b : String(a).localeCompare(String(b));
      return (c || (x.ID < y.ID ? -1 : 1)) * sortDir;
    });
    if (!rows.length){ $("empty").textContent = T.noMatches; $("empty").hidden = false; }
    const p = paged(rows); pages = p.pages; total = p.total;
    const shown = COLS.filter(c => !small || c.ws).length;
    for (const r of p.slice){
      const tr = document.createElement("tr"); tr.className = "row" + (openId === r.ID ? " open" : "");
      for (const c of COLS){
        const td = document.createElement("td"); if (c.cls) td.className = c.cls;
        fillCell(td, r, c.k, pool); tr.appendChild(td);
      }
      tr.addEventListener("click", () => { openId = openId === r.ID ? null : r.ID; renderList(); });
      tbody.appendChild(tr);
      if (openId === r.ID) tbody.appendChild(detailRow(r, pool, shown));
    }
  }
  renderStudyBtn();
  renderPager(pages, total);
  renderPos();
  if (fitPage()) renderList();
}
function renderPager(pages, total){
  const first = total ? page * PAGE + 1 : 0, last = Math.min(total, (page + 1) * PAGE);
  $("count").textContent = pages > 1 ? first + "–" + last + " / " + total : "";
  $("pgPrev").hidden = $("pgNext").hidden = pages <= 1;
  $("pgPrev").disabled = page === 0; $("pgNext").disabled = page >= pages - 1;
}
function setQuery(v){
  qText = v; query = strip(v); $("q").value = v; page = 0; openId = null; saveView(); renderList();
}

/* ── LISTS: two sections of at most five rows each, then the door in ── */
function renderCatalog(){
  const all = listKeys().map(k => getList(k));
  // WD lists not seen yet: fetch them, so the Words column fills in.
  for (const l of all) if ((!l.loaded || (isPublished(l.key) && !l.checked)) && !l.fetching){ l.fetching = true; ensureList(l.key).then(() => { if (level === "catalog") renderCatalog(); }); }
  renderSection("wd", all.filter(l => !l.own), T.published);
  renderSection("my", all.filter(l => l.own), T.onThisDevice);
  renderSyncLine();
  renderPos();
}
function renderSection(id, lists, unit){
  const S = CAT[id], qq = strip(S.q), body = $(id + "Body");
  body.innerHTML = "";
  const rows = qq ? lists.filter(l => strip(l.key).includes(qq)) : lists;
  $(id + "Sub").textContent = unit + " · " + (lists.length ? nLists(lists.length) : T.noneYet);
  $(id + "Ctl").hidden = !lists.length;
  $(id + "Q").value = S.q; $(id + "Q").classList.toggle("on", !!qq);
  const pages = Math.max(1, Math.ceil(rows.length / CAT_PAGE));
  if (S.page >= pages) S.page = pages - 1;
  for (const l of rows.slice(S.page * CAT_PAGE, S.page * CAT_PAGE + CAT_PAGE)){
    const tr = document.createElement("tr"); const n = knownCount(l.key);
    const tdN = document.createElement("td"); tdN.className = "b"; tdN.textContent = l.key;
    const tdW = document.createElement("td"); tdW.className = "id"; tdW.textContent = n ?? "·";
    const tdS = document.createElement("td"); tdS.className = "now";
    if (l.key === activeKey) tdS.textContent = T.studyingNow;
    else if (l.own){ tdS.textContent = ownSince(l.key); tdS.classList.add("dim"); }
    const tdA = document.createElement("td"); tdA.className = "act";
    if (l.rows){ const b = document.createElement("button"); b.className = "ib"; b.textContent = "↓"; b.title = T.excelOut(l.key);
      b.addEventListener("click", e => { e.stopPropagation(); exportList(l.key); }); tdA.appendChild(b); }
    if (l.own){ const x = document.createElement("button"); x.className = "ib x"; x.textContent = "×"; x.title = T.removeHere;
      x.addEventListener("click", e => { e.stopPropagation(); removeList(l.key); }); tdA.appendChild(x); }
    tr.append(tdN, tdW, tdS, tdA);
    tr.addEventListener("click", () => goList(l.key)); body.appendChild(tr);
  }
  $(id + "Empty").hidden = !(lists.length && !rows.length);
  const first = rows.length ? S.page * CAT_PAGE + 1 : 0, last = Math.min(rows.length, (S.page + 1) * CAT_PAGE);
  $(id + "Count").textContent = pages > 1 ? first + "–" + last + " / " + rows.length : "";
  $(id + "Prev").hidden = $(id + "Next").hidden = pages <= 1;
  $(id + "Prev").disabled = S.page === 0; $(id + "Next").disabled = S.page >= pages - 1;
}

const midDeck = () => deckStarted && !deckDone;
function renderStudyBtn(){
  const b = $("btnStudy"), t = viewKey;
  const vis = visibleRows();

/* ── Engine, from v26.98. One change: the finish line.
   A deck of ten; the counter is the number of cards clean right now.
   Again flags the card and keeps it at the front; a dirty pass ends in a
   redemption pass; a redeemed card goes to position 3, still not counted;
   a clean pass counts the card and sends it to the back. Done = every card
   counted. RS +1 / −1 / −2 by timesDirty at completion. ── */
let pipe = [], deckScore = 0, deckDone = false, deckStarted = false, showingA = false, peeking = false, deckSig = "", deckRows = [];
const sigOf = rows => rows.map(r => r.ID).join(",");
function buildDeck(rows, k){
  const pool = readPool(k);
  return [...rows].sort((a, b) => ((pool[a.ID] || 0) - (pool[b.ID] || 0)) || (a.ID < b.ID ? -1 : 1))
    .slice(0, Math.min(DECK_SIZE, rows.length)).map(row => ({ row, fi: 0, passDirty: false, needsRedemption: false, timesDirty: 0, clean: false }));
}
function initDeck(rows){
  deckRows = rows; deckSig = sigOf(rows); pipe = buildDeck(rows, activeKey);
  deckScore = 0; deckDone = false; deckStarted = false; showingA = false; peeking = false;
  saveDeck(); renderCard();
}
const cur = () => pipe[0];
const countClean = () => pipe.filter(x => x.clean).length;
function moveTo(i){ const s = pipe.shift(); pipe.splice(Math.min(i, pipe.length), 0, s); }
function reveal(){ if (deckDone || showingA) return; showingA = true; renderCard(); }
function gradeAgain(){
  if (!showingA || deckDone) return;
  showingA = false; peeking = false; deckStarted = true;
  const s = cur(); if (!s.passDirty){ s.passDirty = true; s.timesDirty++; }
  s.clean = false; deckScore = countClean();
  saveDeck(); renderCard();
}
function gradeGood(){
  if (!showingA || deckDone) return;
  showingA = false; peeking = false; deckStarted = true;
  const s = cur(); s.fi++;
  if (s.fi >= s.row.pairs.length){
    s.fi = 0;
    if (s.passDirty){ s.passDirty = false; s.needsRedemption = true; saveDeck(); renderCard(); return; }
    if (s.needsRedemption){ s.needsRedemption = false; moveTo(3); }
    else { s.clean = true; moveTo(DECK_SIZE - 1); }
    deckScore = countClean();
    if (deckScore === pipe.length){
      deckDone = true;
      const key = "wd_rs_" + activeKey;
      let pool; try { pool = JSON.parse(localStorage.getItem(key)) || {}; } catch { pool = {}; }
      pipe.forEach(x => { const id = x.row.ID, base = (id in pool) ? pool[id] : 0;
        pool[id] = x.timesDirty === 0 ? base + 1 : x.timesDirty === 1 ? base - 1 : base - 2; });
      try { localStorage.setItem(key, JSON.stringify(pool)); } catch {}
      markSyncDirty(); syncCatchUp();            // the one moment a score can change: pull, merge, push
    }
  }
  saveDeck(); renderCard();
}
/* The deck in progress survives a reload: Resume means the same ten cards, same places. */
function saveDeck(){
  try {
    localStorage.setItem(DECK_KEY, JSON.stringify({ list: activeKey, sig: deckSig, done: deckDone, started: deckStarted,
      pipe: pipe.map(x => [x.row.ID, x.fi, x.passDirty ? 1 : 0, x.needsRedemption ? 1 : 0, x.timesDirty, x.clean ? 1 : 0]) }));
  } catch {}
}
function restoreDeck(rows){
  let s; try { s = JSON.parse(localStorage.getItem(DECK_KEY)); } catch { return false; }
  if (!s || s.done || !s.started || s.list !== activeKey || s.sig !== sigOf(rows) || !Array.isArray(s.pipe)) return false;
  const byId = new Map(rows.map(r => [r.ID, r]));
  const p = s.pipe.map(([id, fi, pd, nr, td, c]) => { const row = byId.get(id); return row ? { row, fi: Math.min(fi, row.pairs.length - 1), passDirty: !!pd, needsRedemption: !!nr, timesDirty: td, clean: !!c } : null; });
  if (p.some(x => !x)) return false;
  pipe = p; deckRows = rows; deckSig = s.sig; deckDone = false; deckStarted = true; showingA = false; peeking = false;
  deckScore = countClean();
  return true;
}
function renderCard(){
  paintCounter();
  const card = $("card"), text = $("cardText"), tag = $("cardTag");
  const dots = $("cardDots") || document.createElement("div"); dots.innerHTML = "";
  if (deckDone){ card.classList.add("done"); tag.textContent = ""; text.textContent = T.deckDone; text.className = "card-text a"; return; }
  card.classList.remove("done");
  if (!pipe.length){ tag.textContent = ""; text.textContent = "…"; return; }
  const s = cur(), f = s.row.pairs[s.fi], c = (s.row.CAT || "").toUpperCase(), sub = (s.row.SUB || "").trim().toUpperCase();
  // Going horizontally: one dot per pair of this word.
  if (s.row.pairs.length > 1) s.row.pairs.forEach((_, i) => { const d = document.createElement("i"); d.className = i < s.fi ? "done" : i === s.fi ? "now" : ""; dots.appendChild(d); });
  tag.textContent = sub ? c + " · " + sub : c;
  const showQ = !showingA || peeking;
  text.textContent = showQ ? f.q : f.a; text.className = "card-text " + (showQ ? "q" : "a");

/* ── Sync: ported from index.html v26.98 (the client only; the Worker is untouched).
   Same contract, same keys, same payload: POST /claim {key}, GET /pull?key=,
   POST /push {key, progress} with progress = every non-empty wd_rs_* pool on this
   device (My lists' pools ride along like any other). The wd_sync_* keys are written
   exactly as index.html writes them, so a key claimed on the dark page works here
   and back. The comments of index.html hold the reasoning; the functions below are
   copies, changed only where the lens differs (no loadRS, no initDeck(), its own
   bottom line on LISTS, no QR, no consent cascade). ── */
const SYNC_KEY_STORE = "wd_sync_key";

const SYNC_KEY_LEN = 8;           // XXXX-XXXX
function generateSyncKey(){
  const bytes = new Uint32Array(SYNC_KEY_LEN);
  crypto.getRandomValues(bytes);

  return raw;                       // stored bare, formatted only for display
}
function formatSyncKey(raw){ return raw.slice(0,4) + "-" + raw.slice(4,8); }
function normalizeSyncKey(input){ return (input || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function isValidSyncKey(raw){ return raw.length === SYNC_KEY_LEN && [...raw].every(c => KEY_ALPHABET.includes(c)); }

function setSyncKey(raw){ try { localStorage.setItem(SYNC_KEY_STORE, raw); } catch {} }
function clearSyncKey(){ try { localStorage.removeItem(SYNC_KEY_STORE); } catch {} }

const SYNC_API = "https://sync.worddock.app";
const SYNC_DIRTY_KEY = "wd_sync_dirty";     // "1" while a finished deck is unpushed
const SYNC_LASTPUSH_KEY = "wd_sync_lastpush";
const SYNC_PULL_INTERVAL = 60 * 60 * 1000;  // hourly, foreground only
const SYNC_DELTA_ASK = 100;                 // cards this browser knows better than the key: above this, adoption asks first
const SYNC_STAMP_KEY = "wd_sync_stamp";     // the cloud's updated_at as this device last saw it
const SYNC_LASTPULL_KEY = "wd_sync_lastpull"; // when this device last TRIED to pull
const SYNC_PULL_MIN_GAP  = 60 * 1000;           // guardrail against the alt-tab clicker
const SYNC_MYPUSH_KEY    = "wd_sync_mypush";    // updated_at of THIS device's last successful push
const SYNC_MODE_KEY      = "wd_sync_mode";      // "sync" | "backup" — detected from pull stamps
const SYNC_SOLO_PULLS_KEY= "wd_sync_solopulls"; // consecutive pulls where stamp == own push
const SYNC_SOLO_RESET    = 10;                  // revert to backup after this many solo pulls
const SYNC_COOLDOWN_SYNC = 15 * 60 * 1000;     // 15 min — another device may be waiting
const SYNC_COOLDOWN_BKUP = 3 * 60 * 60 * 1000; // 3 h  — cloud is just a safety copy
const SYNC_BOOT_WAIT     = 3000;               // lens: the first deck waits for a pull at most this long
let syncBusy = false;
let syncPullTimer = null;

/* Lens only: what the bottom line of LISTS says — whether the last request was answered.
   Nothing is stored for it; the wd_sync_* keys stay index.html's. */
let syncFailed = false;
function syncOk(){ syncFailed = false; renderSyncLine(); }
function syncFail(){ syncFailed = true; renderSyncLine(); }

function markSyncDirty(){ try { localStorage.setItem(SYNC_DIRTY_KEY, "1"); } catch {} }
function syncIsDirty(){ try { return localStorage.getItem(SYNC_DIRTY_KEY) === "1"; } catch { return false; } }
function clearSyncDirty(){ try { localStorage.removeItem(SYNC_DIRTY_KEY); } catch {} }
function getSyncStamp(){ try { return parseInt(localStorage.getItem(SYNC_STAMP_KEY) || "0", 10) || 0; } catch { return 0; } }
function setSyncStamp(n){ if (!n) return; try { localStorage.setItem(SYNC_STAMP_KEY, String(n)); } catch {} }
function syncCooldownPassed(){
  try {
    const last = parseInt(localStorage.getItem(SYNC_LASTPUSH_KEY) || "0", 10);
    const mode = localStorage.getItem(SYNC_MODE_KEY) || "backup";
    const gap  = (mode === "sync") ? SYNC_COOLDOWN_SYNC : SYNC_COOLDOWN_BKUP;
    return !last || (Date.now() - last) >= gap;
  } catch { return true; }
}
function stampSyncPush(){ try { localStorage.setItem(SYNC_LASTPUSH_KEY, String(Date.now())); } catch {} }

function allPools(){
  const out = {};
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k || !k.startsWith("wd_rs_")) continue;
    try {
      const pool = JSON.parse(localStorage.getItem(k)) || {};
      if (Object.keys(pool).length) out[k.slice("wd_rs_".length)] = pool;
    } catch {}
  }
  return out;
}
/* Present in both -> max; present in one -> take it. */
function mergePools(local, remote){
  const merged = {};
  const domains = new Set([...Object.keys(local), ...Object.keys(remote)]);
  for (const d of domains){
    const a = local[d] || {}, b = remote[d] || {};
    const ids = new Set([...Object.keys(a), ...Object.keys(b)]);
    const pool = {};
    for (const id of ids){
      if (id in a && id in b) pool[id] = Math.max(a[id], b[id]);
      else                    pool[id] = (id in a) ? a[id] : b[id];
    }
    merged[d] = pool;
  }

}
function writePools(pools){
  for (const [domain, pool] of Object.entries(pools)){
    try { localStorage.setItem("wd_rs_" + domain, JSON.stringify(pool)); } catch {}
  }
}
function _syncTimeout(){
  return (typeof AbortSignal !== "undefined" && AbortSignal.timeout) ? AbortSignal.timeout(8000) : undefined;
}
async function fetchCloud(key){
  const res = await fetch(SYNC_API + "/pull?key=" + key, { signal: _syncTimeout() });
  return await res.json();
}
function replacePools(cloud){
  const keep = new Set(Object.keys(cloud));
  const gone = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.startsWith("wd_rs_") && !keep.has(k.slice("wd_rs_".length))) gone.push(k);
  }
  for (const k of gone){ try { localStorage.removeItem(k); } catch {} }
  writePools(cloud);
}
/* mode "merge": max per card (adoption). mode "rule": stamp unchanged → local stays;

function applyCloud(data, mode){
  if (!data || data.empty || !data.progress) return;
  const stamp = parseInt(data.updated_at, 10) || 0;
  let how = "merge";
  if (mode === "rule"){
    const seen = getSyncStamp();
    if (seen && stamp && stamp === seen) return;        // local stays
    if (seen && !syncIsDirty()) how = "replace";
    try {
      const myPush = parseInt(localStorage.getItem(SYNC_MYPUSH_KEY) || "0", 10);
      const someoneElsePushed = stamp && (myPush === 0 || stamp !== myPush);
      if (someoneElsePushed){
        localStorage.setItem(SYNC_MODE_KEY, "sync");
        localStorage.setItem(SYNC_SOLO_PULLS_KEY, "0");
      } else {
        const solo = parseInt(localStorage.getItem(SYNC_SOLO_PULLS_KEY) || "0", 10) + 1;
        localStorage.setItem(SYNC_SOLO_PULLS_KEY, String(solo));
        if (solo >= SYNC_SOLO_RESET) localStorage.setItem(SYNC_MODE_KEY, "backup");
      }
    } catch {}
  }
  if (how === "replace") replacePools(data.progress);
  else                   writePools(mergePools(allPools(), data.progress));
  setSyncStamp(stamp);
  // Lens: a deck nobody started was dealt from the pre-merge pool, so deal it again;
  // a running deck is untouched (completion re-reads the live pool). The table repaints.
  if (deckUnstarted()) initDeck(deckRows);
  if (level !== "study") render();
}
function deckUnstarted(){ return pipe.length > 0 && !deckStarted && !deckDone && !showingA; }
function deltaAgainstCloud(cloudProgress){
  const local = allPools();
  let n = 0;
  for (const d of Object.keys(local)){
    const a = local[d], b = (cloudProgress && cloudProgress[d]) || {};
    for (const id of Object.keys(a)){ if (a[id] > (b[id] || 0)) n++; }
  }

}
function syncPullRecently(){
  try {
    const last = parseInt(localStorage.getItem(SYNC_LASTPULL_KEY) || "0", 10);
    return last && (Date.now() - last) < SYNC_PULL_MIN_GAP;
  } catch { return false; }
}
function stampSyncPull(){ try { localStorage.setItem(SYNC_LASTPULL_KEY, String(Date.now())); } catch {} }
async function syncPull(){
  const key = getSyncKey();

  if (syncPullRecently()) return;        // braked, nothing sent
  stampSyncPull();
  syncBusy = true;
  try {
    const data = await fetchCloud(key);
    if (data && data.error) throw new Error(data.error);
    applyCloud(data, "rule");
    syncOk();
  } catch {
    syncFail();                          // offline or server down — local stays authoritative
  } finally {
    syncBusy = false;
  }
}
/* The gate: dirty + cooldown, unless forced (key creation, key adoption). */
function syncPush(force, leaving){
  const key = getSyncKey();
  if (!key) return;
  if (!force && !syncIsDirty()) return;          // nothing new to say
  if (!force && !syncCooldownPassed()) return;   // too soon
  const body = JSON.stringify({ key, progress: allPools() });
  const CT = "text/plain;charset=UTF-8";          // load-bearing: no preflight (see index.html)
  if (!force) stampSyncPush();
  try {
    if (leaving && navigator.sendBeacon){
      const blob = new Blob([body], { type: CT });
      if (navigator.sendBeacon(SYNC_API + "/push", blob)){ clearSyncDirty(); return; }
    }
    fetch(SYNC_API + "/push", { method: "POST", headers: { "content-type": CT }, body, keepalive: true })
      .then(r => (r && r.ok) ? r.json().catch(() => ({ ok: true })) : null)
      .then(j => {
        if (!j){ syncFail(); return; }
        clearSyncDirty();
        const t = parseInt(j.updated_at, 10) || 0;
        setSyncStamp(t);
        if (!force){ try { localStorage.setItem(SYNC_MYPUSH_KEY, String(t)); } catch {} }

      })
      .catch(() => syncFail());

}
/* Strict: no server, no key. Network failure throws to the caller. */
async function syncClaim(key){
  const res = await fetch(SYNC_API + "/claim", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ key }), signal: _syncTimeout()
  });
  const data = await res.json();
  if (data.ok) return key;
  return null;                        // taken, or unexpected: caller regenerates / does not mint
}
/* Pull and merge FIRST, then push whatever this device still owes. */
async function syncCatchUp(){ await syncPull(); syncPush(); }
function startSyncPullTimer(){
  stopSyncPullTimer();
  if (!getSyncKey()) return;
  syncPullTimer = setInterval(() => { if (document.visibilityState === "visible") syncPull(); }, SYNC_PULL_INTERVAL);
}
function stopSyncPullTimer(){ if (syncPullTimer){ clearInterval(syncPullTimer); syncPullTimer = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ syncPush(); stopSyncPullTimer(); }
  else { syncCatchUp(); startSyncPullTimer(); }
});
window.addEventListener("pagehide", () => syncPush(false, true));

/* Key creation and adoption, as on the dark page. */
async function claimFreshKey(){
  let fresh = null;
  for (let attempt = 0; attempt < 5 && !fresh; attempt++) fresh = await syncClaim(generateSyncKey());
  return fresh;
}
let _claimFail = "server";
async function doCreateKey(){
  let fresh = null;
  try { fresh = await claimFreshKey(); }
  catch { _claimFail = "offline"; setSyncState("claim-failed"); return false; }
  if (!fresh){ _claimFail = "server"; setSyncState("claim-failed"); return false; }
  setSyncKey(fresh);
  syncPush(true);                     // a new key carries the progress this browser already holds
  startSyncPullTimer();
  renderSyncLine();
  setSyncState("main");
  return true;
}
let _pendingAdopt = null;
function adoptKey(key, data){
  setSyncKey(key);
  applyCloud(data, "merge");
  syncPush(true);                     // the merged state goes back up
  startSyncPullTimer();
  renderSyncLine();
  setSyncState("main");

/* ── The sync dialog: one frame, its content switches between states. ── */
let _syncState = "main";
function setSyncState(s){ _syncState = s; renderSyncPanelBody(); }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function sBtn(label, cls, onClick){ const b = el("button", cls, label); b.type = "button"; b.addEventListener("click", onClick); return b; }
function sActions(...btns){ const d = el("div", "dlg-actions sync-actions"); btns.forEach(b => d.appendChild(b)); return d; }
function sKey(k){ return el("div", "sync-key", formatSyncKey(k)); }
function sPin(){ const p = el("p", "sync-desc"); p.appendChild(el("b", "", T.syncPin)); return p; }
function renderSyncPanelBody(){
  const root = $("syncBody"); if (!root) return;
  root.innerHTML = "";
  const st = _syncState, key = getSyncKey();
  const title = t => root.appendChild(el("h3", "", t));
  const desc = t => root.appendChild(el("p", "sync-desc", t));
  const errLine = () => root.appendChild(el("p", "sync-err", ""));
  if (st === "help"){
    title(T.syncHelpTitle); desc(T.syncHelp1);
    const p = el("p", "sync-desc"); p.appendChild(el("b", "", T.syncHelp2)); root.appendChild(p);
    root.appendChild(sActions(sBtn(T.syncBack, "dlg-cancel", () => setSyncState("main"))));
    return;
  }
  if (st === "confirm-new"){
    title(T.syncNewTitle); desc(T.syncNewBody);
    const create = sBtn(T.syncCreateNew, "dlg-cancel", async () => { create.textContent = T.syncCreating; create.disabled = true; await doCreateKey(); });
    root.appendChild(sActions(sBtn(T.syncCancel, "dlg-cancel", () => setSyncState("main")), create,
      sBtn(T.syncHaveKey, "dlg-ok", () => setSyncState("enter-key"))));
    return;
  }
  if (st === "confirm-off"){
    title(T.syncOffTitle); desc(T.syncOffBody); if (key) root.appendChild(sKey(key));
    root.appendChild(sActions(
      sBtn(T.syncTurnOffBtn, "dlg-cancel", () => { clearSyncKey(); stopSyncPullTimer(); renderSyncLine(); setSyncState("main"); }),
      sBtn(T.syncKeepOn, "dlg-ok", () => setSyncState("main"))));
    return;
  }
  if (st === "claim-failed"){
    title(T.syncClaimFailTitle); desc(_claimFail === "offline" ? T.syncClaimOffline : T.syncClaimServer);
    const retry = sBtn(T.syncTryAgain, "dlg-ok", async () => { retry.textContent = T.syncCreating; retry.disabled = true; await doCreateKey(); });
    root.appendChild(sActions(sBtn(T.syncCancel, "dlg-cancel", () => setSyncState("main")), retry));
    return;
  }
  if (st === "key-collision"){
    const p = _pendingAdopt; if (!p){ setSyncState("enter-key"); return; }
    title(T.syncCollTitle);
    const w = el("p", "sync-desc"); w.appendChild(el("b", "", T.syncCollWarn)); root.appendChild(w);
    desc(T.syncCollBody(deltaAgainstCloud(p.data.progress)));
    const merge = sBtn(T.syncMerge, "dlg-ok", async () => {
      const q = _pendingAdopt; if (!q) return;
      merge.textContent = T.syncMerging; merge.disabled = true;
      let fresh = q.data; try { fresh = await fetchCloud(q.key); } catch {}
      _pendingAdopt = null; adoptKey(q.key, fresh);
    });
    root.appendChild(sActions(sBtn(T.syncCancel, "dlg-cancel", () => { _pendingAdopt = null; setSyncState("enter-key"); }), merge));
    return;
  }
  if (st === "enter-key"){
    title(T.syncEnterTitle); desc(T.syncEnterBody);
    const inp = el("input", "sync-input"); inp.type = "text"; inp.placeholder = T.syncKeyPh;
    inp.autocomplete = "off"; inp.spellcheck = false; root.appendChild(inp);
    root.appendChild(sPin());
    const err = errLine();
    const connect = sBtn(T.syncConnect, "dlg-ok", async () => {
      const raw = normalizeSyncKey(inp.value);
      if (!isValidSyncKey(raw)){ err.textContent = T.syncBadKey; return; }
      connect.textContent = T.syncConnecting; connect.disabled = true;
      let peek;
      try { peek = await fetchCloud(raw); }
      catch { err.textContent = T.syncNoServer; connect.textContent = T.syncConnect; connect.disabled = false; return; }
      if (peek && peek.empty){ err.textContent = T.syncNoSuchKey; connect.textContent = T.syncConnect; connect.disabled = false; return; }
      if (deltaAgainstCloud(peek.progress) > SYNC_DELTA_ASK){ _pendingAdopt = { key: raw, data: peek }; setSyncState("key-collision"); return; }
      adoptKey(raw, peek);
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); connect.click(); } });
    root.appendChild(sActions(sBtn(T.syncCancel, "dlg-cancel", () => setSyncState("main")), connect));
    setTimeout(() => inp.focus(), 50);
    return;
  }
  // main
  if (key){
    title(T.syncOnTitle); root.appendChild(sKey(key)); root.appendChild(sPin());
    const copy = sBtn(T.syncCopy, "dlg-ok", async () => {
      try { await navigator.clipboard.writeText(formatSyncKey(key)); copy.textContent = T.syncCopied; }
      catch { copy.textContent = T.syncSelect; }
      setTimeout(() => { copy.textContent = T.syncCopy; }, 1600);
    });
    root.appendChild(sActions(sBtn("?", "dlg-cancel", () => setSyncState("help")),
      sBtn(T.syncTurnOff, "dlg-cancel", () => setSyncState("confirm-off")), copy));
  } else {
    title(T.syncOffTitleMain); desc(T.syncOffDesc);
    root.appendChild(sActions(sBtn("?", "dlg-cancel", () => setSyncState("help")),
      sBtn(T.syncCreateKey, "dlg-cancel", () => setSyncState("confirm-new")),
      sBtn(T.syncHaveKey, "dlg-ok", () => setSyncState("enter-key"))));
  }
}
function showSyncPanel(){ _syncState = "main"; renderSyncPanelBody(); $("syncBack").hidden = false; }
function hideSyncPanel(){ $("syncBack").hidden = true; }

/* The bottom line of LISTS: small, grey, one line of truth; tap opens the dialog.
   No key: "Keep progress safe". A key: "Sync is on", or "Not synced — will retry"
   after a request that got no answer. */
function renderSyncLine(){
  const a = $("syncLine"); if (!a) return;
  if (!getSyncKey()){ a.textContent = T.keepSafe; a.classList.remove("fail"); return; }
  a.classList.toggle("fail", syncFailed);
  a.textContent = syncFailed ? T.notSynced : T.syncOn;
}

/* ── Dialog: a question with two buttons, or a question with one field ── */
function confirmDlg(title, body, okLabel, cancelLabel){
  return new Promise(res => {
    const back = $("dlgBack"), ok = $("dlgOk"), cancel = $("dlgCancel");
    $("dlgInput").hidden = true;
    $("dlgTitle").textContent = title; $("dlgBody").textContent = body; ok.textContent = okLabel; cancel.textContent = cancelLabel; back.hidden = false;
    const done = v => { back.hidden = true; ok.onclick = cancel.onclick = back.onclick = null; document.removeEventListener("keydown", onKey, true); res(v); };
    const onKey = e => { if (e.key === "Escape"){ e.stopPropagation(); done(false); } if (e.key === "Enter"){ e.stopPropagation(); e.preventDefault(); done(true); } };
    ok.onclick = () => done(true); cancel.onclick = () => done(false); back.onclick = e => { if (e.target === back) done(false); };
    document.addEventListener("keydown", onKey, true); ok.focus();
  });
}
function promptDlg(title, body, value){
  return new Promise(res => {
    const back = $("dlgBack"), ok = $("dlgOk"), cancel = $("dlgCancel"), inp = $("dlgInput");
    $("dlgTitle").textContent = title; $("dlgBody").textContent = body; ok.textContent = T.ok; cancel.textContent = T.cancel;
    inp.hidden = false; inp.value = value || ""; back.hidden = false;
    const done = v => { back.hidden = true; inp.hidden = true; ok.onclick = cancel.onclick = back.onclick = null; document.removeEventListener("keydown", onKey, true); res(v); };
    const onKey = e => { if (e.key === "Escape"){ e.stopPropagation(); done(null); } if (e.key === "Enter"){ e.stopPropagation(); e.preventDefault(); done(inp.value); } };
    ok.onclick = () => done(inp.value); cancel.onclick = () => done(null); back.onclick = e => { if (e.target === back) done(null); };
    document.addEventListener("keydown", onKey, true); inp.focus(); inp.select();
  });
}

/* ── Input ── */
$("btnStudy").addEventListener("click", onStudy);
$("btnAdd").addEventListener("click", () => { $("fileIn").value = ""; $("fileIn").click(); });
$("syncLine").addEventListener("click", showSyncPanel);
$("syncX").addEventListener("click", hideSyncPanel);
$("syncBack").addEventListener("click", e => { if (e.target === $("syncBack")) hideSyncPanel(); });
$("fileIn").addEventListener("change", () => { const f = $("fileIn").files[0]; if (f) importSheet(f); });
$("pgPrev").addEventListener("click", () => { if (page > 0){ page--; openId = null; renderList(); } });
$("pgNext").addEventListener("click", () => { page++; openId = null; renderList(); });
for (const id of ["wd", "my"]){
  $(id + "Q").addEventListener("input", e => { CAT[id].q = e.target.value; CAT[id].page = 0; renderCatalog(); });
  $(id + "Prev").addEventListener("click", () => { if (CAT[id].page > 0){ CAT[id].page--; renderCatalog(); } });
  $(id + "Next").addEventListener("click", () => { CAT[id].page++; renderCatalog(); });
}
let rsz = null;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (level !== "study") render(); }, 120); });
$("q").addEventListener("input", e => {
  qText = e.target.value; query = strip(qText); page = 0; openId = null; saveView(); renderList();
});
$("lvl").addEventListener("input", e => { lvlText = e.target.value; page = 0; openId = null; saveView(); renderList(); });
$("lvl").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("card").addEventListener("click", () => {
  if (deckDone){ initDeck(deckRows); return; }
  if (showingA){ peeking = !peeking; renderCard(); return; }
  reveal();
});
$("btnGood").addEventListener("click", e => { gradeGood(); e.currentTarget.blur(); });
$("btnAgain").addEventListener("click", e => { gradeAgain(); e.currentTarget.blur(); });
document.addEventListener("keydown", e => {
  if (!$("dlgBack").hidden) return;
  if (!$("syncBack").hidden){ if (e.key === "Escape") hideSyncPanel(); return; }
  if (level === "about"){ if (e.key === "Escape"){ e.preventDefault(); closeAbout(); } return; }
  if (level !== "study"){
    if (document.activeElement && ["INPUT","SELECT"].includes(document.activeElement.tagName)) return;
    if (level === "list"){
      if (e.key === "ArrowRight" && !$("pgNext").hidden && !$("pgNext").disabled) $("pgNext").click();
      if (e.key === "ArrowLeft" && !$("pgPrev").hidden && !$("pgPrev").disabled) $("pgPrev").click();
      if (e.key === "/"){ e.preventDefault(); $("q").focus(); }
    }
    if (e.key === "Escape" && level === "catalog" && activeKey) goList(activeKey);
    return;
  }
  if (e.key === " " || e.key === "Enter"){ e.preventDefault(); if (deckDone) initDeck(deckRows); else if (!showingA) reveal(); else gradeGood(); }
  if ((e.key === "ArrowLeft" || e.key === "p" || e.key === "P") && showingA && !deckDone){ e.preventDefault(); gradeAgain(); }
  if (e.key === "Escape") goList(activeKey);
});

/* ── Boot: land in study, like the app; the list sits one step back ── */
(async () => {
  // A reload keeps the screen the user was on (the browser keeps history.state across a
  // reload); a fresh open (new tab, the app icon) has no state and lands on the card.
  const back = history.state && history.state.wd && history.state.level !== "study" ? history.state : null;
  applyT();
  loadOwn();
  let wanted = null; try { wanted = localStorage.getItem(LIST_KEY); } catch {}
  wanted = canonKey(wanted || WD_KEYS[0]);
  activeKey = wanted;
  let l = await ensureList(wanted);
  if (activeKey !== wanted){ wanted = activeKey; l = getList(wanted); }   // published wins: the copy moved to -OWN
  if (!l.rows && wanted !== WD_KEYS[0]){ wanted = WD_KEYS[0]; l = await ensureList(wanted); }
  if (usingSample) document.title += T.sample;
  if (!l.rows){ activeKey = null; viewKey = wanted; level = "list"; show(); try { history.replaceState(navState(), ""); } catch {} syncCatchUp(); startSyncPullTimer(); return; }
  activeKey = wanted; viewKey = wanted;
  try { localStorage.setItem(LIST_KEY, activeKey); } catch {}
  loadView(activeKey);
  // Pull before the first deck is built, so it is dealt from the merged pool; never wait long.
  if (getSyncKey()) await Promise.race([syncPull(), new Promise(r => setTimeout(r, SYNC_BOOT_WAIT))]);
  let src = visibleRows();
  if (!src.length){ qText = query = lvlText = ""; $("q").value = $("lvl").value = ""; saveView(); src = l.rows; }
  if (!restoreDeck(src)) initDeck(src);
  syncPush();                                   // settle any debt, after the pull
  startSyncPullTimer();
  level = "list";
  if (back){ resumeScreen(back); return; }
  try { history.replaceState(navState(), ""); } catch {}
  enterStudy();
})();
function resumeScreen(s){
  if (s.level === "catalog"){ goCatalog(true); return; }
  const k = canonKey(s.k || activeKey), known = isPublished(k) || (LISTS[k] && LISTS[k].own);
  if (s.level === "about"){ goCatalog(true); openAbout(true, s.pane === "detail" && isSmall() ? "detail" : "rail"); return; }
  goList(known ? k : activeKey, true);
}
</script>

<script>
/* Register the service worker (sw.js): what makes WordDock installable and openable
   with no connection. Copied from v26.98: after 'load', silent on failure. */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
